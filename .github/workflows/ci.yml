name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  server-tests:
    name: 服务端单元测试（${{ matrix.python-version }} / ${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements.txt pytest
      - name: 运行单元测试
        working-directory: server
        run: python -m pytest tests -q

  frontend-checks:
    name: 前端逻辑校验（从真实源码抽取函数运行）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: 离线朗读分段逻辑
        run: node tools/check_offline_speech.js
      - name: 资料 / 下载名 / 收听进度逻辑
        run: node tools/check_web_utils.js
